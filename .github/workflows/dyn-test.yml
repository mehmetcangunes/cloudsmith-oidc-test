name: cloudsmith-dyn-map-test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dyn-test:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange default-audience token via dynamic mapping
        run: |
          set -e
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "--- token claims ---"
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq '{aud,repository,repository_owner,ref,sub,iss}'
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" -X POST \
            "https://api.cloudsmith.io/openid/cstestorg-cangns/" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\":\"$TOKEN\",\"service_slug\":\"research-svc2\"}")
          echo "--- exchange result ---"
          echo "$RESP" | tail -c 300
