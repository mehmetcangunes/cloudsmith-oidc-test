name: cloudsmith-oidc-test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Cloudsmith OIDC exchange with different audiences
        run: |
          set -e
          for AUD in "api://cloudsmith" "https://api.cloudsmith.io" "cloudsmith" "totally-wrong-audience" ""; do
            echo "============================"
            echo "Testing audience: '${AUD:-<empty>}'"
            if [ -z "$AUD" ]; then
              TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            else
              TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
            fi
            echo "token aud: $(echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq -r .aud)"
            RESP=$(curl -sS -w "\nHTTP:%{http_code}" -X POST \
              "https://api.cloudsmith.io/openid/cstestorg-cangns/" \
              -H "Content-Type: application/json" \
              -d "{\"oidc_token\":\"$TOKEN\",\"service_slug\":\"research-svc\"}")
            echo "$RESP" | tail -c 500
            echo
          done
